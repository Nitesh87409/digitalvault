<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Account – DigitalVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #0a0a0f; color: #e8e8f0; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Syne', sans-serif; }
    .gold-text { color: #f5c842; }
    .gold-btn { background: linear-gradient(135deg,#f5c842,#e0a800); color: #0a0a0f; font-family: 'Syne',sans-serif; font-weight: 700; border: none; cursor: pointer; transition: all 0.3s; padding: 12px 24px; border-radius: 12px; font-size: 0.9rem; }
    .gold-btn:hover { box-shadow: 0 0 25px rgba(245,200,66,0.4); transform: translateY(-1px); }
    .gold-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .inp { background: #1a1a2a; border: 1px solid rgba(255,255,255,0.08); color: #fff; outline: none; width: 100%; padding: 12px 16px; border-radius: 12px; font-size: 0.875rem; transition: border-color 0.2s; font-family: 'DM Sans', sans-serif; }
    .inp:focus { border-color: rgba(245,200,66,0.5); }
    .inp:disabled { opacity: 0.5; cursor: not-allowed; }
    .inp::placeholder { color: #4b5563; }
    .card { background: #12121a; border: 1px solid rgba(245,200,66,0.1); border-radius: 16px; }
    nav { background: rgba(10,10,15,0.95); border-bottom: 1px solid rgba(245,200,66,0.1); backdrop-filter: blur(20px); padding: 16px 24px; position: sticky; top: 0; z-index: 100; }

    /* Sidebar tabs */
    .tab-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 0.875rem; color: #6b7280; border: none; background: none; width: 100%; text-align: left; font-family: 'DM Sans', sans-serif; }
    .tab-btn:hover { background: rgba(245,200,66,0.06); color: #e8e8f0; }
    .tab-btn.active { background: rgba(245,200,66,0.1); color: #f5c842; border: 1px solid rgba(245,200,66,0.2); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Order/Download cards */
    .order-card { background: #0e0e18; border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 18px; transition: border-color 0.2s; }
    .order-card:hover { border-color: rgba(245,200,66,0.2); }
    .badge-paid { background: rgba(16,185,129,0.15); color: #10b981; padding: 3px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }
    .badge-pending { background: rgba(245,200,66,0.15); color: #f5c842; padding: 3px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }

    /* Alert */
    .alert-success { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2); color: #10b981; padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; }
    .alert-error { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; }

    /* Avatar */
    .avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg,#f5c842,#e0a800); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; color: #0a0a0f; font-family: 'Syne', sans-serif; flex-shrink: 0; }

    /* Download btn */
    .dl-btn { background: linear-gradient(135deg,#f5c842,#e0a800); color: #0a0a0f; font-weight: 700; font-family: 'Syne',sans-serif; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; border: none; cursor: pointer; }
    .dl-btn:hover { box-shadow: 0 0 20px rgba(245,200,66,0.3); }

    @media(max-width:768px) { .sidebar { display: none; } .sidebar.open { display: block; } }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div style="max-width:1152px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
    <a href="index.html" style="font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;color:#f5c842;text-decoration:none;">DigitalVault</a>
    <div style="display:flex;align-items:center;gap:16px;">
      <a href="index.html" style="font-size:0.875rem;color:#6b7280;text-decoration:none;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#6b7280'">← Store</a>
      <a href="cart.html" style="color:#9ca3af;position:relative;" onmouseover="this.style.color='#f5c842'" onmouseout="this.style.color='#9ca3af'">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      </a>
      <button onclick="logout()" style="font-size:0.8rem;color:#ef4444;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;">Logout</button>
    </div>
  </div>
</nav>

<!-- MAIN -->
<div style="max-width:1100px;margin:0 auto;padding:32px 20px;">

  <!-- Profile Header -->
  <div class="card" style="padding:24px;margin-bottom:24px;display:flex;align-items:center;gap:20px;">
    <div class="avatar" id="avatar-initials">?</div>
    <div>
      <h1 style="font-size:1.4rem;font-weight:700;color:#fff;" id="header-name">Loading...</h1>
      <p style="color:#6b7280;font-size:0.875rem;margin-top:2px;" id="header-email"></p>
    </div>
    <div style="margin-left:auto;text-align:right;">
      <p style="font-size:0.7rem;color:#4b5563;margin-bottom:2px;">Member since</p>
      <p style="font-size:0.8rem;color:#9ca3af;" id="header-joined"></p>
    </div>
  </div>

  <!-- Layout -->
  <div style="display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start;">

    <!-- Sidebar -->
    <div class="card sidebar" style="padding:12px;">
      <button class="tab-btn active" onclick="switchTab('profile')" id="tab-profile">
        <span>👤</span> My Profile
      </button>
      <button class="tab-btn" onclick="switchTab('downloads')" id="tab-downloads">
        <span>⬇️</span> My Downloads
      </button>
      <button class="tab-btn" onclick="switchTab('orders')" id="tab-orders">
        <span>🛒</span> Order History
      </button>
      <button class="tab-btn" onclick="switchTab('password')" id="tab-password">
        <span>🔐</span> Change Password
      </button>
      <div style="border-top:1px solid rgba(255,255,255,0.05);margin:8px 0;"></div>
      <button class="tab-btn" onclick="logout()" style="color:#ef4444;">
        <span>🚪</span> Logout
      </button>
    </div>

    <!-- Content -->
    <div>

      <!-- PROFILE TAB -->
      <div class="tab-content active card" id="content-profile" style="padding:28px;">
        <h2 style="font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:20px;">My Profile</h2>
        <div style="display:flex;flex-direction:column;gap:16px;max-width:480px;">
          <div>
            <label style="font-size:0.75rem;color:#9ca3af;display:block;margin-bottom:6px;font-weight:600;">Full Name</label>
            <input id="edit-name" type="text" class="inp" placeholder="Your name"/>
          </div>
          <div>
            <label style="font-size:0.75rem;color:#9ca3af;display:block;margin-bottom:6px;font-weight:600;">Email Address</label>
            <input id="edit-email" type="email" class="inp" placeholder="your@email.com" disabled style="opacity:0.5;cursor:not-allowed;" title="Email cannot be changed"/>
            <p style="font-size:0.7rem;color:#4b5563;margin-top:4px;">Email cannot be changed</p>
          </div>
          <div>
            <label style="font-size:0.75rem;color:#9ca3af;display:block;margin-bottom:6px;font-weight:600;">Phone Number</label>
            <input id="edit-phone" type="tel" class="inp" placeholder="10-digit number" maxlength="10"/>
          </div>
          <div id="profile-msg" style="display:none;"></div>
          <div>
            <button onclick="saveProfile()" class="gold-btn" id="save-profile-btn">Save Changes</button>
          </div>
        </div>
      </div>

      <!-- DOWNLOADS TAB -->
      <div class="tab-content card" id="content-downloads" style="padding:28px;">
        <h2 style="font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:6px;">My Downloads</h2>
        <p style="color:#6b7280;font-size:0.8rem;margin-bottom:20px;">All your purchased products — download anytime</p>
        <div id="downloads-list">
          <div style="text-align:center;padding:40px 0;">
            <div style="width:40px;height:40px;border:3px solid #f5c842;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;"></div>
            <p style="color:#6b7280;font-size:0.875rem;">Loading your downloads...</p>
          </div>
        </div>
      </div>

      <!-- ORDERS TAB -->
      <div class="tab-content card" id="content-orders" style="padding:28px;">
        <h2 style="font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:6px;">Order History</h2>
        <p style="color:#6b7280;font-size:0.8rem;margin-bottom:20px;">All your orders and their status</p>
        <div id="orders-list">
          <div style="text-align:center;padding:40px 0;">
            <div style="width:40px;height:40px;border:3px solid #f5c842;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;"></div>
            <p style="color:#6b7280;font-size:0.875rem;">Loading orders...</p>
          </div>
        </div>
      </div>

      <!-- PASSWORD TAB -->
      <div class="tab-content card" id="content-password" style="padding:28px;">
        <h2 style="font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:20px;">Change Password</h2>
        <div style="display:flex;flex-direction:column;gap:16px;max-width:480px;">
          <div>
            <label style="font-size:0.75rem;color:#9ca3af;display:block;margin-bottom:6px;font-weight:600;">Current Password</label>
            <input id="curr-pass" type="password" class="inp" placeholder="••••••••"/>
          </div>
          <div>
            <label style="font-size:0.75rem;color:#9ca3af;display:block;margin-bottom:6px;font-weight:600;">New Password</label>
            <input id="new-pass" type="password" class="inp" placeholder="Min 6 characters"/>
          </div>
          <div>
            <label style="font-size:0.75rem;color:#9ca3af;display:block;margin-bottom:6px;font-weight:600;">Confirm New Password</label>
            <input id="conf-pass" type="password" class="inp" placeholder="Repeat new password"/>
          </div>
          <div id="pass-msg" style="display:none;"></div>
          <button onclick="changePassword()" class="gold-btn" id="change-pass-btn">Update Password</button>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
const API = Config.API;
const token = localStorage.getItem(Config.TOKEN_KEY);
const customer = JSON.parse(localStorage.getItem(Config.AUTH_KEY) || 'null');

// Auth check
if (!token || !customer) {
  window.location.href = 'login.html?redirect=account.html';
}

// Init profile header
function initHeader() {
  const initials = customer.name.split(' ').map(w => w[0]).join('').toUpperCase().substring(0,2);
  document.getElementById('avatar-initials').textContent = initials;
  document.getElementById('header-name').textContent = customer.name;
  document.getElementById('header-email').textContent = customer.email;

  // Fill form fields
  document.getElementById('edit-name').value = customer.name || '';
  document.getElementById('edit-email').value = customer.email || '';
  document.getElementById('edit-phone').value = customer.phone || '';
}

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('content-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');

  if (tab === 'downloads') loadDownloads();
  if (tab === 'orders') loadOrders();
}

// Save Profile
async function saveProfile() {
  const name = document.getElementById('edit-name').value.trim();
  const phone = document.getElementById('edit-phone').value.trim();
  const msgEl = document.getElementById('profile-msg');
  const btn = document.getElementById('save-profile-btn');

  if (!name) { showMsg('profile-msg', 'Name is required.', false); return; }
  if (phone && !/^\d{10}$/.test(phone)) { showMsg('profile-msg', 'Enter valid 10-digit phone.', false); return; }

  btn.textContent = 'Saving...'; btn.disabled = true;

  try {
    const res = await fetch(`${API}/customer/update`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'authorization': token },
      body: JSON.stringify({ name, phone })
    });
    const data = await res.json();
    if (data.flag) {
      // Update localStorage
      const updated = { ...customer, name, phone };
      localStorage.setItem(Config.AUTH_KEY, JSON.stringify(updated));
      document.getElementById('header-name').textContent = name;
      const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().substring(0,2);
      document.getElementById('avatar-initials').textContent = initials;
      showMsg('profile-msg', '✅ Profile updated successfully!', true);
    } else {
      showMsg('profile-msg', data.message || 'Update failed.', false);
    }
  } catch(e) {
    showMsg('profile-msg', 'Connection error.', false);
  }
  btn.textContent = 'Save Changes'; btn.disabled = false;
}

// Change Password
async function changePassword() {
  const curr = document.getElementById('curr-pass').value;
  const newp = document.getElementById('new-pass').value;
  const conf = document.getElementById('conf-pass').value;
  const btn = document.getElementById('change-pass-btn');

  if (!curr || !newp || !conf) { showMsg('pass-msg', 'Please fill all fields.', false); return; }
  if (newp.length < 6) { showMsg('pass-msg', 'New password must be at least 6 characters.', false); return; }
  if (newp !== conf) { showMsg('pass-msg', 'New passwords do not match.', false); return; }

  btn.textContent = 'Updating...'; btn.disabled = true;

  try {
    const res = await fetch(`${API}/customer/change-password`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'authorization': token },
      body: JSON.stringify({ current_password: curr, new_password: newp })
    });
    const data = await res.json();
    if (data.flag) {
      showMsg('pass-msg', '✅ Password changed successfully!', true);
      document.getElementById('curr-pass').value = '';
      document.getElementById('new-pass').value = '';
      document.getElementById('conf-pass').value = '';
    } else {
      showMsg('pass-msg', data.message || 'Failed to change password.', false);
    }
  } catch(e) {
    showMsg('pass-msg', 'Connection error.', false);
  }
  btn.textContent = 'Update Password'; btn.disabled = false;
}

// Load Downloads
async function loadDownloads() {
  const container = document.getElementById('downloads-list');
  try {
    const res = await fetch(`${API}/order/my-orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: customer.email })
    });
    const data = await res.json();

    if (!data.flag || !data.orders || data.orders.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:40px 0;">
          <div style="font-size:3rem;margin-bottom:12px;">📦</div>
          <h3 style="color:#fff;margin-bottom:8px;">No purchases yet</h3>
          <p style="color:#6b7280;font-size:0.875rem;margin-bottom:20px;">Browse our products and make your first purchase!</p>
          <a href="index.html" style="background:linear-gradient(135deg,#f5c842,#e0a800);color:#0a0a0f;padding:10px 24px;border-radius:10px;text-decoration:none;font-weight:700;font-family:'Syne',sans-serif;">Browse Products →</a>
        </div>`;
      return;
    }

    container.innerHTML = data.orders.map(order => {
      const date = new Date(order.createdAt).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
      const productName = order.product_id?.name || 'Digital Product';
      const productId = order.product_id?._id || order.product_id;
      const dlUrl = productId
        ? `${API}/order/file/${order.download_token}/${productId}`
        : `download.html?token=${order.download_token}`;

      return `
        <div class="order-card" style="margin-bottom:12px;display:flex;align-items:center;gap:16px;">
          <!-- Product image -->
          <div style="width:64px;height:64px;border-radius:10px;overflow:hidden;background:#1a1a2a;flex-shrink:0;">
            ${order.product_id?.images?.[0]
              ? `<img src="${API}${order.product_id.images[0]}" style="width:100%;height:100%;object-fit:cover;"/>`
              : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📦</div>`
            }
          </div>
          <!-- Info -->
          <div style="flex:1;min-width:0;">
            <h3 style="font-weight:700;color:#fff;font-size:0.95rem;margin-bottom:2px;">${productName}</h3>
            <p style="color:#6b7280;font-size:0.75rem;">${date} · ₹${order.amount?.toLocaleString()}</p>
          </div>
          <!-- Download btn -->
          <a href="${dlUrl}" target="_blank" rel="noopener" class="dl-btn">⬇️ Download</a>
        </div>`;
    }).join('');

  } catch(e) {
    container.innerHTML = '<p style="color:#ef4444;text-align:center;padding:20px;">Error loading downloads.</p>';
  }
}

// Load Orders
async function loadOrders() {
  const container = document.getElementById('orders-list');
  try {
    const res = await fetch(`${API}/order/my-orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: customer.email })
    });
    const data = await res.json();

    if (!data.flag || !data.orders || data.orders.length === 0) {
      container.innerHTML = `<div style="text-align:center;padding:40px 0;"><div style="font-size:3rem;margin-bottom:12px;">🛒</div><p style="color:#6b7280;">No orders yet.</p></div>`;
      return;
    }

    container.innerHTML = `
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
          <thead>
            <tr style="border-bottom:1px solid rgba(255,255,255,0.06);">
              <th style="text-align:left;padding:10px 12px;color:#6b7280;font-weight:500;">#</th>
              <th style="text-align:left;padding:10px 12px;color:#6b7280;font-weight:500;">Product</th>
              <th style="text-align:left;padding:10px 12px;color:#6b7280;font-weight:500;">Date</th>
              <th style="text-align:left;padding:10px 12px;color:#6b7280;font-weight:500;">Amount</th>
              <th style="text-align:left;padding:10px 12px;color:#6b7280;font-weight:500;">Status</th>
            </tr>
          </thead>
          <tbody>
            ${data.orders.map((order, i) => {
              const date = new Date(order.createdAt).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
              return `
                <tr style="border-bottom:1px solid rgba(255,255,255,0.04);" onmouseover="this.style.background='rgba(255,255,255,0.02)'" onmouseout="this.style.background='none'">
                  <td style="padding:12px;color:#4b5563;">${i+1}</td>
                  <td style="padding:12px;color:#e8e8f0;font-weight:500;">${order.product_id?.name || 'Digital Product'}</td>
                  <td style="padding:12px;color:#6b7280;">${date}</td>
                  <td style="padding:12px;color:#f5c842;font-weight:700;">₹${order.amount?.toLocaleString()}</td>
                  <td style="padding:12px;"><span class="${order.payment_status === 1 ? 'badge-paid' : 'badge-pending'}">${order.payment_status === 1 ? '✓ Paid' : '⏳ Pending'}</span></td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    container.innerHTML = '<p style="color:#ef4444;text-align:center;padding:20px;">Error loading orders.</p>';
  }
}

// Helper
function showMsg(id, msg, success) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = success ? 'alert-success' : 'alert-error';
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

function logout() {
  localStorage.removeItem(Config.TOKEN_KEY);
  localStorage.removeItem(Config.AUTH_KEY);
  window.location.href = 'login.html';
}

// Init
initHeader();
</script>
</body>
</html>
