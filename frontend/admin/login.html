<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – DigitalVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #0a0a0f; color: #e8e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    h1,h2 { font-family: 'Syne', sans-serif; }
    .gold-btn { background: linear-gradient(135deg,#f5c842,#e0a800); color: #0a0a0f; font-weight: 700; font-family: 'Syne',sans-serif; cursor: pointer; border: none; transition: all 0.3s; }
    .gold-btn:hover { box-shadow: 0 0 30px rgba(245,200,66,0.4); }
    .inp { background: #1a1a2a; border: 1px solid rgba(255,255,255,0.08); color: white; outline: none; transition: border-color 0.2s; }
    .inp:focus { border-color: rgba(245,200,66,0.4); }
  </style>
</head>
<body>
  <div class="w-full max-w-sm mx-4">
    <div class="text-center mb-8">
      <div class="text-2xl font-bold mb-1" style="color:#f5c842;font-family:'Syne',sans-serif;">DigitalVault</div>
      <p class="text-gray-500 text-sm">Admin Panel</p>
    </div>
    <div style="background:#12121a;border:1px solid rgba(245,200,66,0.15);border-radius:16px" class="p-8">
      <h2 class="text-xl font-bold text-white mb-6">Sign In</h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Email</label>
          <input id="email" type="email" class="inp w-full px-4 py-3 rounded-xl text-sm" placeholder="admin@digitalvault.in"/>
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Password</label>
          <input id="password" type="password" class="inp w-full px-4 py-3 rounded-xl text-sm" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
        </div>
        <div id="error-msg" class="text-red-400 text-xs hidden"></div>
        <button onclick="login()" id="login-btn" class="gold-btn w-full py-3 rounded-xl text-sm mt-2">Sign In →</button>
      </div>
    </div>
    <p class="text-center text-gray-600 text-xs mt-6"><a href="../index.html" class="hover:text-yellow-400 transition">← Back to site</a></p>
  </div>

  <script>
    const API = '../..'; // Relative to admin folder; change to your API URL

    // Redirect if already logged in
    if (localStorage.getItem('admin_token')) window.location.href = 'dashboard.html';

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error-msg');
      const btn = document.getElementById('login-btn');

      if (!email || !password) { errEl.textContent = 'Please enter email and password.'; errEl.classList.remove('hidden'); return; }

      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        const res = await fetch(`http://localhost:5000/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.flag) {
          localStorage.setItem('admin_token', data.token);
          localStorage.setItem('admin_data', JSON.stringify(data.admin));
          window.location.href = 'dashboard.html';
        } else {
          errEl.textContent = data.message || 'Invalid credentials.';
          errEl.classList.remove('hidden');
        }
      } catch(e) {
        errEl.textContent = 'Connection error. Is the server running?';
        errEl.classList.remove('hidden');
      }

      btn.textContent = 'Sign In →';
      btn.disabled = false;
    }
  </script>
</body>
</html>
